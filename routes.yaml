# Historia Arcana — routes for Commentarii Mundi
#
# NOT part of the theme. Upload this in Ghost Admin → Settings → Labs → Routes.
#
# ---------------------------------------------------------------------------
# The three levels
# ---------------------------------------------------------------------------
#   /commentarii-mundi/                    landing page (a Ghost page — no route
#                                          needed, resolved by slug)
#   /commentarii-mundi/ukraine/            conflict overview, cm-conflict.hbs
#   /commentarii-mundi/ukraine/{slug}/     single report, post.hbs → CM layout
#
# ---------------------------------------------------------------------------
# Why collections here, and channels for regions
# ---------------------------------------------------------------------------
# A collection OWNS the permalinks of the posts it matches, which is exactly what
# is wanted: reports must live under their conflict. The usual cost — moving posts
# off their existing URLs — is zero here, because Commentarii Mundi is new content
# with no published URLs to break. Historia Arcana's own posts stay in the root
# collection and are untouched.
#
# A post can belong to only ONE collection, so:
#   - conflict collections MUST be listed before the root "/" collection
#   - a report tagged with two conflicts lands in whichever is listed first
#   - regions must NOT be collections, or they would steal posts from their parent
#     conflict. Regions are channels (below), which own no permalinks.
#
# ---------------------------------------------------------------------------
# Adding a conflict
# ---------------------------------------------------------------------------
# 1. Create the public Ghost tag (e.g. "ukraine") with a description and a feature
#    image — the theme uses both on the conflict cards.
# 2. Add its slug to "commentarii_conflicts" in Ghost Admin → Design.
# 3. Copy a collection block below, replacing the slug in the route, the permalink,
#    `data` and `filter`.
#
# The publication tag is INTERNAL: display form #commentarii-mundi, slug
# hash-commentarii-mundi. Filters must use the slug.

routes:

  # Full cross-conflict report archive — where "Weitere Berichte laden" points.
  # A channel, not a collection: these posts already belong to a conflict
  # collection and cannot belong to a second one.
  /commentarii-mundi/berichte/:
    controller: channel
    template: cm-reports
    filter: tag:hash-commentarii-mundi

  # --- Regions ------------------------------------------------------------
  # The deepest level. Channels, so they never compete with the conflict
  # collection for posts. Declared before the collections below so the explicit
  # route wins over the /commentarii-mundi/ukraine/{slug}/ permalink pattern —
  # which also means a region slug must not collide with a report slug.
  #
  # /commentarii-mundi/ukraine/mykolaiv/:
  #   controller: channel
  #   template: cm-region
  #   data: tag.mykolaiv
  #   filter: tag:hash-commentarii-mundi+tag:ukraine

collections:

  # --- Conflicts ----------------------------------------------------------
  # `template` renders the overview at the collection root; `data` gives it the
  # {{#tag}} context (name, description, feature_image); `permalink` puts each
  # report underneath its conflict.

  /commentarii-mundi/ukraine/:
    permalink: /commentarii-mundi/ukraine/{slug}/
    template: cm-conflict
    data: tag.ukraine
    filter: tag:hash-commentarii-mundi+tag:ukraine

  /commentarii-mundi/sudan/:
    permalink: /commentarii-mundi/sudan/{slug}/
    template: cm-conflict
    data: tag.sudan
    filter: tag:hash-commentarii-mundi+tag:sudan

  /commentarii-mundi/myanmar/:
    permalink: /commentarii-mundi/myanmar/{slug}/
    template: cm-conflict
    data: tag.myanmar
    filter: tag:hash-commentarii-mundi+tag:myanmar

  # Everything else — Historia Arcana's normal posts. MUST stay last: the first
  # matching collection wins, and this one matches everything.
  /:
    permalink: /{slug}/
    template: index

# Ghost replaces its entire routing config with this file, so the taxonomies block
# is required. Omitting it would drop /tag/ and /author/ across the whole site.

taxonomies:
  tag: /tag/{slug}/
  author: /author/{slug}/
